<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">Sistema de Compras</div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="usuarios.html">Usuários</a>
            <a href="produtos.html">Produtos</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="compras.html" class="active">Compras</a>
            <a href="relatorios.html">Relatórios (Grafico)</a>
            <a href="relatorios-tabela.html">Relatórios (Tabela)</a>
        </nav>
    </header>

    <main class="container">
        <h1>Compras</h1>
        <div class="toolbar">
            <div class="search-box">
                <input type="number" id="buscaId" placeholder="Buscar por ID...">
                <button class="btn-secondary" id="btnBuscar">Buscar</button>
                <button class="btn-secondary" id="btnLimparBusca">Limpar</button>
            </div>
            <a href="compra-nova.html"><button class="btn-primary">+ Nova Compra</button></a>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Qtde</th>
                        <th>Preço Final</th>
                        <th>Pagamento</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCompras">
                    <tr class="empty-row"><td colspan="10">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/compras.js"></script>
</body>
</html>
