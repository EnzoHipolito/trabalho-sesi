<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">Sistema de Compras</div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="usuarios.html" class="active">Usuários</a>
            <a href="produtos.html">Produtos</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="compras.html">Compras</a>
            <a href="relatorios.html">Relatórios (Grafico)</a>
            <a href="relatorios-tabela.html">Relatórios (Tabela)</a>
        </nav>
    </header>

    <main class="container">
        <h1>Usuários</h1>
        <div class="toolbar">
            <div class="search-box">
                <input type="number" id="buscaId" placeholder="Buscar por ID...">
                <button class="btn-secondary" id="btnBuscarId">Buscar</button>
                <input type="text" id="buscaNome" placeholder="Buscar por nome...">
                <button class="btn-secondary" id="btnBuscarNome">Buscar</button>
                <button class="btn-secondary" id="btnLimparBusca">Limpar</button>
            </div>
            <a href="usuario-novo.html"><button class="btn-primary">+ Novo Usuário</button></a>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>UF</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr class="empty-row"><td colspan="8">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/usuarios.js"></script>
</body>
</html>
