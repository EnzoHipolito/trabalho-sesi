<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">Sistema de Compras</div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="usuarios.html" class="active">Usuários</a>
            <a href="produtos.html">Produtos</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="compras.html">Compras</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
    </header>

    <main class="container">
        <h1>Usuários</h1>
        <div id="alertBox" class="alert"></div>

        <div class="toolbar">
            <div class="search-box">
                <input type="number" id="buscaId" placeholder="Buscar por ID...">
                <button class="btn-secondary" id="btnBuscarId">Buscar</button>
                <input type="text" id="buscaNome" placeholder="Buscar por nome...">
                <button class="btn-secondary" id="btnBuscarNome">Buscar</button>
                <button class="btn-secondary" id="btnLimparBusca">Limpar</button>
            </div>
            <button class="btn-primary" id="btnNovo">+ Novo Usuário</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>UF</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr class="empty-row"><td colspan="8">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitulo">Novo Usuário</h2>
            <form id="formUsuario">
                <input type="hidden" id="codUsuario">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Nome</label>
                        <input type="text" id="nome" maxlength="40" required>
                    </div>
                    <div class="form-field">
                        <label>Sobrenome</label>
                        <input type="text" id="sobrenome" maxlength="40" required>
                    </div>
                    <div class="form-field">
                        <label>Idade</label>
                        <input type="number" id="idade" min="0" required>
                    </div>
                    <div class="form-field">
                        <label>Telefone</label>
                        <input type="text" id="telefone" maxlength="20" required>
                    </div>
                    <div class="form-field full">
                        <label>Email</label>
                        <input type="email" id="email" maxlength="40" required>
                    </div>
                    <div class="form-field full">
                        <label>Endereço</label>
                        <input type="text" id="endereco" maxlength="255" required>
                    </div>
                    <div class="form-field">
                        <label>Cidade</label>
                        <input type="text" id="cidade" maxlength="40" required>
                    </div>
                    <div class="form-field">
                        <label>Estado (UF)</label>
                        <input type="text" id="estado" maxlength="2" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
